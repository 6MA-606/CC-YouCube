name: Pylint

on:
    workflow_dispatch:
    push:
        paths:
            - "src/**/*.py"
            - "tests/**/*.py"
            - ".github/workflows/pylint.yml"
    pull_request:
        paths:
            - "src/**/*.py"
            - "tests/**/*.py"
            - ".github/workflows/pylint.yml"

jobs:
    pylint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r src/requirements.txt
                  pip install pylint

            - name: Pylint
              run: pylint src/youcube/*.py
