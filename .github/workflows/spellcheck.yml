name: Spellcheck

on:
    workflow_dispatch:
    push:
        paths:
            - "src/**/*.py"
            - "tests/**/*.py"
            - ".pyspelling.yml"
            - "spellcheck_wordlist.txt"
    pull_request:
        paths:
            - "src/**/*.py"
            - "tests/**/*.py"
            - ".pyspelling.yml"
            - "spellcheck_wordlist.txt"

jobs:
    spellcheck:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Spellcheck
              uses: rojopolis/spellcheck-github-actions@0.69.0
