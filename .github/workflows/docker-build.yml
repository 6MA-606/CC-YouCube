name: Build Docker image

on:
    workflow_dispatch:
    pull_request:
    push:
        branches-ignore: [main]

jobs:
    build-image:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Build image
              uses: docker/build-push-action@v6
              with:
                  context: src
                  push: false
